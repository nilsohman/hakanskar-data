name: Fetch Netatmo data

on:
  schedule:
    - cron: '15 * * * *'   # varje timme, kl xx:15
  workflow_dispatch: {}     # gör att du kan köra den manuellt från fliken "Actions"

permissions:
  contents: write   # så jobbet får skriva/pusha den nya JSON-filen

concurrency:
  group: netatmo-fetch      # hindrar två körningar från att krocka om token
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Installera beroenden
        run: pip install requests pynacl

      - name: Hämta Netatmo-data och skriv JSON
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, time, base64
          import requests
          import nacl.public, nacl.encoding
          from datetime import datetime, timezone

          CLIENT_ID = os.environ['NETATMO_CLIENT_ID']
          CLIENT_SECRET = os.environ['NETATMO_CLIENT_SECRET']
          REFRESH_TOKEN = os.environ['NETATMO_REFRESH_TOKEN']
          GH_PAT = os.environ.get('GH_PAT')
          REPO = os.environ['GITHUB_REPO']
          GH_HEADERS = {'Authorization': f'Bearer {GH_PAT}',
                        'Accept': 'application/vnd.github+json'}


          def request_with_retry(method, url, **kwargs):
              """HTTP-anrop med omforsok vid tillfalliga fel (5xx, 429, natverk)."""
              last = None
              for attempt in range(4):
                  try:
                      resp = requests.request(method, url, timeout=30, **kwargs)
                      if resp.status_code < 500 and resp.status_code != 429:
                          return resp
                      last = f'{resp.status_code}: {resp.text[:200]}'
                  except requests.RequestException as e:
                      last = str(e)
                  if attempt < 3:
                      wait = 5 * (attempt + 1)
                      print(f'Tillfalligt fel ({last}) - forsoker igen om {wait}s...')
                      time.sleep(wait)
              print('FEL: inget svar efter flera forsok:', url, last)
              raise SystemExit(1)


          # ---- 0. Kontrollera att GH_PAT fungerar INNAN Netatmo-token rors ----
          # Har GH_PAT gatt ut avbryts korningen har, medan Netatmo-token
          # fortfarande ar oanvand och giltig. Da racker det att fornya GH_PAT.
          if not GH_PAT:
              print('FEL: secreten GH_PAT saknas.')
              raise SystemExit(1)
          kr = request_with_retry('GET',
              f'https://api.github.com/repos/{REPO}/actions/secrets/public-key',
              headers=GH_HEADERS)
          if kr.status_code != 200:
              print(f'FEL: GH_PAT fungerar inte ({kr.status_code}): {kr.text[:300]}')
              print('--> Har den gatt ut? Fornya den och uppdatera secreten GH_PAT.')
              print('--> Netatmo-token har INTE rorts, sa inget annat behover goras.')
              raise SystemExit(1)
          GH_KEY = kr.json()


          def save_refresh_token(value):
              """Sparar ny refresh-token som GitHub-secret."""
              pk = nacl.public.PublicKey(GH_KEY['key'].encode(), nacl.encoding.Base64Encoder())
              enc = nacl.public.SealedBox(pk).encrypt(value.encode())
              pr = request_with_retry('PUT',
                  f'https://api.github.com/repos/{REPO}/actions/secrets/NETATMO_REFRESH_TOKEN',
                  headers=GH_HEADERS,
                  json={'encrypted_value': base64.b64encode(enc).decode(),
                        'key_id': GH_KEY['key_id']})
              if pr.status_code not in (201, 204):
                  print(f'FEL: kunde inte spara ny refresh-token ({pr.status_code}).',
                        pr.text[:300])
                  raise SystemExit(1)
              print('Ny refresh-token sparad som secret.')


          # ---- 1. Förnya access-token (Netatmo ger samtidigt en NY refresh-token) ----
          r = request_with_retry('POST', 'https://api.netatmo.com/oauth2/token', data={
              'grant_type': 'refresh_token',
              'refresh_token': REFRESH_TOKEN,
              'client_id': CLIENT_ID,
              'client_secret': CLIENT_SECRET,
          })
          if r.status_code != 200:
              print('FEL vid token-fornyelse:', r.status_code, r.text[:500])
              if 'invalid_grant' in r.text:
                  print('--> Den sparade refresh-token galler inte langre.')
                  print('--> Skapa en ny i Netatmos Token generator (scope read_station)')
                  print('--> och uppdatera secreten NETATMO_REFRESH_TOKEN.')
              raise SystemExit(1)

          tokens = r.json()
          access_token = tokens['access_token']
          new_refresh_token = tokens.get('refresh_token', REFRESH_TOKEN)

          # ---- 2. Spara den nya refresh-token DIREKT ----
          # Maste ske innan nagot annat kan misslyckas: Netatmo har redan
          # ogiltigforklarat den gamla.
          if new_refresh_token != REFRESH_TOKEN:
              save_refresh_token(new_refresh_token)

          # ---- 3. Hämta stationsdata (aktuella temperaturer + enhets-ID) ----
          r = request_with_retry('GET', 'https://api.netatmo.com/api/getstationsdata',
                                 headers={'Authorization': f'Bearer {access_token}'})
          if r.status_code != 200:
              print('FEL vid getstationsdata:', r.status_code, r.text[:500])
              raise SystemExit(1)
          station = r.json()['body']['devices'][0]

          device_id = station['_id']
          indoor_temp = station['dashboard_data']['Temperature']
          indoor_time = station['dashboard_data']['time_utc']

          outdoor_temp = None
          outdoor_time = None
          rain_module_id = None
          for module in station.get('modules', []):
              dash = module.get('dashboard_data') or {}
              if module['type'] == 'NAModule1':      # utemodul
                  outdoor_temp = dash.get('Temperature')
                  outdoor_time = dash.get('time_utc')
              elif module['type'] == 'NAModule3':    # regnmätare
                  rain_module_id = module['_id']

          # ---- 4. Hämta regnmängd, senaste 30 dygnen ----
          rain_30d = []
          if rain_module_id:
              date_end = int(time.time())
              date_begin = date_end - 31 * 24 * 3600
              r = request_with_retry('GET', 'https://api.netatmo.com/api/getmeasure',
                                     headers={'Authorization': f'Bearer {access_token}'},
                                     params={
                                         'device_id': device_id,
                                         'module_id': rain_module_id,
                                         'scale': '1day',
                                         'type': 'sum_rain',
                                         'date_begin': date_begin,
                                         'date_end': date_end,
                                     })
              if r.status_code != 200:
                  print('FEL vid getmeasure:', r.status_code, r.text[:500])
                  raise SystemExit(1)
              for entry in r.json()['body']:
                  beg = entry['beg_time']
                  step = entry.get('step_time') or 86400
                  for i, v in enumerate(entry.get('value', [])):
                      day_ts = beg + i * step
                      day = datetime.fromtimestamp(day_ts, tz=timezone.utc).strftime('%Y-%m-%d')
                      mm = v[0] if v and v[0] is not None else 0
                      rain_30d.append({'date': day, 'mm': round(mm, 1)})
              rain_30d = rain_30d[-30:]

          # ---- 5. Skriv resultatet till en publik JSON-fil ----
          output = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'indoor_temp': indoor_temp,
              'indoor_time': indoor_time,
              'outdoor_temp': outdoor_temp,
              'outdoor_time': outdoor_time,
              'rain_30d': rain_30d,
          }
          os.makedirs('docs', exist_ok=True)
          with open('docs/netatmo-data.json', 'w') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print('Skrev docs/netatmo-data.json')
          PYEOF

      - name: Checka in ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/netatmo-data.json
          git diff --staged --quiet || git commit -m "Uppdatera Netatmo-data"
          git pull --rebase --autostash
          git push
